    public int[] twoSum(int[] nums, int target) {

            if (map.containsKey(complement)) {
                return new int[] { map.get(complement), i };

    public List<List<Integer>> levelOrder(TreeNode root) {
        List<List<Integer>> result = new ArrayList<>();
        if (root == null) return result;
        Queue<TreeNode> queue = new LinkedList<>();
        queue.offer(root);
        while (!queue.isEmpty()) {
            int size = queue.size();
            List<Integer> currentLevel = new ArrayList<>();
            for (int i = 0; i < size; i++) {
                TreeNode node = queue.poll();
                currentLevel.add(node.val);
                if (node.left != null) queue.offer(node.left);
                if (node.right != null) queue.offer(node.right);
            }
            result.add(currentLevel);
        }
        return result;

    public int[] maxSlidingWindow(int[] nums, int k) {
        if (nums == null || k <= 0) return new int[0];
        int n = nums.length;
        int[] result = new int[n - k + 1];
        int ri = 0;
        Deque<Integer> deque = new ArrayDeque<>();
        for (int i = 0; i < n; i++) {
            // Remove indices out of current window bounds
            if (!deque.isEmpty() && deque.peekFirst() < i - k + 1) {
                deque.pollFirst();
            }
            // Remove smaller elements from back as they are useless
            while (!deque.isEmpty() && nums[deque.peekLast()] < nums[i]) {
                deque.pollLast();
            }
            deque.offerLast(i);
            if (i >= k - 1) {
                result[ri++] = nums[deque.peekFirst()];
            }
        }
        return result;
    }

                            const diffColor = p.difficulty === 'Easy' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400' : p.difficulty === 'Medium' ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-400' : 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-400';
                            
                            return `
                                <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div class="flex items-center gap-3">
                                            <input type="checkbox" ${isCompleted ? 'checked' : ''} onclick="toggleProblemComplete('${p.id}')" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" title="Mark completed">
                                            <span class="text-xs font-bold text-slate-400">#${p.number}</span>
                                            <a href="${p.link}" target="_blank" class="font-bold text-lg hover:text-indigo-600 transition flex items-center gap-1.5">${p.title} <i class="fa-solid fa-external-link text-xs"></i></a>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <span class="px-2.5 py-0.5 rounded text-xs font-semibold ${diffColor}">${p.difficulty}</span>
                                            <span class="px-2.5 py-0.5 rounded text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">${p.variation}</span>
                                        </div>
                                    </div>

                                    <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">${p.statement}</p>

                                    <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl text-xs space-y-1 font-mono">
                                        <div><strong>Input/Output:</strong> ${p.inputOutput}</div>
                                        <div><strong>Constraints:</strong> ${p.constraints}</div>
                                        <div><strong>What it teaches:</strong> <span class="font-sans">${p.teaches}</span></div>
                                    </div>

                                    <!-- Show Answer Button -->
                                    <button onclick="toggleAnswer('${p.id}')" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold hover:bg-indigo-700 transition flex items-center gap-2">
                                        <i class="fa-solid fa-eye"></i> Show Answer & 9-Part Explanation
                                    </button>

                                    <!-- 9-Part Detailed Answer (Hidden by Default) -->
                                    <div id="${p.id}" class="hidden mt-4 pt-6 border-t border-slate-200 dark:border-slate-800 space-y-6 text-sm">
                                        
                                        <!-- 1. Problem Understanding -->
                                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl">
                                            <h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">1. Problem Understanding</h4>
                                            <p class="text-slate-600 dark:text-slate-300 text-xs">${p.understanding}</p>
                                        </div>

                                        <!-- 2. Brute-Force Solution -->
                                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl">
                                            <h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">2. Brute-Force Solution & Limitations</h4>
                                            <p class="text-slate-600 dark:text-slate-300 text-xs">${p.bruteForce}</p>
                                        </div>

                                        <!-- 3. Optimized Approach -->
                                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl">
                                            <h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">3. Optimized Approach & Pattern Derivation</h4>
                                            <p class="text-slate-600 dark:text-slate-300 text-xs">${p.optimized}</p>
                                        </div>

                                        <!-- 4. Complete Java Implementation -->
                                        <div>
                                            <div class="flex items-center justify-between mb-2">
                                                <h4 class="font-bold text-indigo-600 dark:text-indigo-400">4. Complete Java Implementation</h4>
                                                <button onclick="copyCodeText(this)" class="px-3 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg text-xs font-semibold transition flex items-center gap-1">
                                                    <i class="fa-solid fa-copy"></i> Copy Java Code
                                                </button>
                                            </div>
                                            <pre class="bg-slate-950 text-slate-100 p-4 rounded-xl text-xs font-mono overflow-x-auto custom-scrollbar"><code>${escapeHtml(p.code)}</code></pre>
                                        </div>

                                        <!-- 5. Detailed Code Explanation -->
                                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl">
                                            <h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">5. Detailed Code Explanation</h4>
                                            <p class="text-slate-600 dark:text-slate-300 text-xs leading-relaxed">${p.explanation}</p>
                                        </div>

                                        <!-- 6. Dry Run -->
                                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl">
                                            <h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">6. Dry Run Walkthrough</h4>
                                            <p class="text-slate-600 dark:text-slate-300 text-xs leading-relaxed">${p.dryRun}</p>
                                        </div>

                                        <!-- 7. Complexity Analysis -->
                                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl">
                                            <h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">7. Complexity Analysis</h4>
                                            <p class="text-slate-600 dark:text-slate-300 text-xs">${p.complexity}</p>
                                        </div>

                                        <!-- 8. Edge Cases -->
                                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl">
                                            <h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">8. Edge Cases Handled</h4>
                                            <p class="text-slate-600 dark:text-slate-300 text-xs">${p.edgeCases}</p>
                                        </div>

                                        <!-- 9. Alternatives & Common Mistakes -->
                                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl">
                                            <h4 class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">9. Alternative Approaches & Common Mistakes</h4>
                                            <p class="text-slate-600 dark:text-slate-300 text-xs">${p.alternatives}</p>
                                        </div>

                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            contentArea.scrollTop = 0;
            renderSidebar();
        }

        function toggleProblemComplete(id) {
            if (completedItems.includes(id)) {
                completedItems = completedItems.filter(i => i !== id);
                showToast('Problem marked incomplete');
            } else {
                completedItems.push(id);
                showToast('Problem marked completed! Great job 🚀');
            }
            localStorage.setItem('leetcode_completed_items', JSON.stringify(completedItems));
            updateProgress();
            renderSidebar();
        }

        function updateProgress() {
            let totalProblems = 0;
            handbookData.forEach(cat => cat.patterns.forEach(pat => totalProblems += pat.problems.length));
            const percentage = Math.round((completedItems.length / totalProblems) * 100);
            
            document.getElementById('progressText').innerText = `${completedItems.length} / ${totalProblems} completed`;
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        function toggleAnswer(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function filterDifficulty(diff) {
            currentFilter = diff;
            renderSidebar();
            showToast(`Filtered by difficulty: ${diff}`);
        }

        function copyCodeText(btn) {
            const pre = btn.parentElement.nextElementSibling;
            const range = document.createRange();
            range.selectNode(pre);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            try {
                document.execCommand('copy');
                showToast('Java code copied to clipboard!');
            } catch (err) {
                showToast('Failed to copy code.');
            }
            window.getSelection().removeAllRanges();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.oninput = (e) => {
                const query = e.target.value.toLowerCase();
                if (!query) {
                    renderSidebar();
                    return;
                }
                const navContainer = document.getElementById('navLinks');
                navContainer.innerHTML = '';
                
                handbookData.forEach(cat => {
                    const matchedPatterns = cat.patterns.filter(pat => 
                        pat.title.toLowerCase().includes(query) || 
                        pat.problems.some(p => p.title.toLowerCase().includes(query) || p.number.includes(query))
                    );
                    if (matchedPatterns.length > 0) {
                        const catHeader = document.createElement('div');
                        catHeader.className = 'px-3 py-2 text-xs font-bold text-slate-400 uppercase tracking-wider mt-4';
                        catHeader.innerText = cat.category;
                        navContainer.appendChild(catHeader);

                        matchedPatterns.forEach(pat => {
                            const btn = document.createElement('button');
                            btn.className = 'w-full text-left px-3 py-2.5 rounded-xl transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold';
                            btn.innerText = pat.title;
                            btn.onclick = () => loadPattern(pat.id);
                            navContainer.appendChild(btn);
                        });
                    }
                });
            };
        }

        function setupTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
            }

            themeToggle.onclick = () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            };
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('sidebarToggle').onclick = () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        };

        window.onload = initHandbook;
    </script>
<script src="header.js"></script>
</body>
</html>
