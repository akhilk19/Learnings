// Thread-Safe Double-Checked Locking Singleton implementation in Java 17
public class DatabaseConnectionPool {
    
    // Volatile ensures visibility across threads during lazy initialization
    private static volatile DatabaseConnectionPool instance;
    private int activeConnections;

    // Private constructor prevents direct instantiation
    private DatabaseConnectionPool() {
        this.activeConnections = 10;
        System.out.println("-> [INIT] DatabaseConnectionPool initialized with 10 connections.");
    }

    // Public global access point with Double-Checked Locking
    public static DatabaseConnectionPool getInstance() {
        if (instance == null) {
            synchronized (DatabaseConnectionPool.class) {
                if (instance == null) {
                    instance = new DatabaseConnectionPool();
                }
            }
        }
        return instance;
    }

    public void executeQuery(String query) {
        System.out.println("Executing query via Singleton instance: " + query);
    }

    public static void main(String[] args) {
        // Test thread-safe singleton
        Runnable task = () -> {
            DatabaseConnectionPool pool = DatabaseConnectionPool.getInstance();
            System.out.println(Thread.currentThread().getName() + " -> Instance Hash: " + pool.hashCode());
        };

        Thread t1 = new Thread(task, "Worker-1");
        Thread t2 = new Thread(task, "Worker-2");
        t1.start();
        t2.start();
    }
}`,

// Abstract Products
interface Button { void paint(); }
interface Checkbox { void check(); }

// Windows Family
class WinButton implements Button { public void paint() { System.out.println("Rendering a Windows style button 🪟"); } }
class WinCheckbox implements Checkbox { public void check() { System.out.println("Checking Windows checkbox ☑️"); } }

class MacCheckbox implements Checkbox { public void check() { System.out.println("Checking MacOS checkbox 🟩"); } }

interface GUIFactory {
    Button createButton();
    Checkbox createCheckbox();
}

interface Prototype extends Cloneable {
    Prototype cloneObject();

class GameCharacter implements Prototype {

interface Notifier {
    void send(String message);
}

class BasicNotifier implements Notifier {
    @Override
    public void send(String message) {
        System.out.println("Sending Email: " + message);
    }
}

abstract class NotifierDecorator implements Notifier {
    protected final Notifier wrapped;

    public NotifierDecorator(Notifier wrapped) {
        this.wrapped = wrapped;
    }

    public void send(String message) {
        wrapped.send(message);
    }
}

class SlackDecorator extends NotifierDecorator {
    public SlackDecorator(Notifier wrapped) { super(wrapped); }

    @Override
    public void send(String message) {
        super.send(message);
        sendSlack(message);
    }

    private void sendSlack(String message) {
        System.out.println("Sending Slack alert: " + message);
    }
}

class EncryptionDecorator extends NotifierDecorator {
    public EncryptionDecorator(Notifier wrapped) { super(wrapped); }

    @Override
    public void send(String message) {
        String encrypted = "[ENCRYPTED] " + message;
        super.send(encrypted);
    }
}

}

class RealImage implements Image {

        this.filename = filename;

    }

    private void loadFromDisk() {

    public void display() {

    }
}

// Virtual Proxy
class ProxyImage implements Image {
    private final String filename;
    private RealImage realImage;

    public ProxyImage(String filename) {
        this.filename = filename;
    }

    @Override
    public void display() {
        if (realImage == null) {
            realImage = new RealImage(filename); // Lazy initialization
        }
        realImage.display();
    }
}

class DirectoryItem implements FileSystemItem {

    }

interface TreeType {

class ConcreteTreeType implements TreeType {
    private final String name;
    private final String color;
    private final String texture;

    public ConcreteTreeType(String name, String color, String texture) {
        this.name = name;
        this.color = color;
        this.texture = texture;
    }

    @Override
    public void draw(int x, int y) {
        System.out.println("Drawing " + color + " " + name + " tree with texture " + texture + " at (" + x + "," + y + ")");
    }
}

// Flyweight Factory
class TreeFactory {
    private static final Map<String, TreeType> treeTypes = new HashMap<>();

    public static TreeType getTreeType(String name, String color, String texture) {
        String key = name + "-" + color + "-" + texture;
        treeTypes.computeIfAbsent(key, k -> new ConcreteTreeType(name, color, texture));
        return treeTypes.get(key);
    }
}

import java.util.List;
import java.util.ArrayList;

interface Iterator<T> {

    T next();
}

interface Aggregate<T> {
    Iterator<T> createIterator();
}

class BookCollection implements Aggregate<String> {
    private final List<String> books = new ArrayList<>();

    public void addBook(String book) { books.add(book); }

    public Iterator<String> createIterator() {
        return new BookIterator(this.books);
    }
}

class BookIterator implements Iterator<String> {
    private final List<String> books;
    private int index = 0;

    public BookIterator(List<String> books) { this.books = books; }

    public boolean hasNext() { return index < books.size(); }
    public String next() { return books.get(index++); }
}

        collection.addBook("Clean Code");

        while (iterator.hasNext()) {
            System.out.println("Book: " + iterator.next());
        }
    }
}`,

import java.util.List;
import java.util.ArrayList;

// Memento
class EditorMemento {
    private final String content;
    public EditorMemento(String content) { this.content = content; }
    public String getContent() { return content; }
}

// Originator
class TextEditor {
    private String content;

    public void setContent(String content) { this.content = content; }
    public String getContent() { return content; }

    public EditorMemento save() { return new EditorMemento(content); }
    public void restore(EditorMemento memento) { this.content = memento.getContent(); }
}

// Caretaker
class History {
    private final List<EditorMemento> history = new ArrayList<>();

    public void push(EditorMemento memento) { history.add(memento); }
    public EditorMemento pop() {
        if (history.isEmpty()) return null;
        return history.remove(history.size() - 1);
    }
}

public class MementoDemo {
    public static void main(String[] args) {
        TextEditor editor = new TextEditor();
        History history = new History();

        editor.setContent("Version 1");
        history.push(editor.save());

        editor.setContent("Version 2 - Updated");
        System.out.println("Current: " + editor.getContent());

        editor.restore(history.pop());
        System.out.println("Restored: " + editor.getContent());
    }
}`,

interface Expression {
    boolean interpret(String context);
}

class TerminalExpression implements Expression {
    private final String data;
    public TerminalExpression(String data) { this.data = data; }

    public boolean interpret(String context) {
        return context.contains(data);
    }
}

class OrExpression implements Expression {
    private final Expression expr1;
    private final Expression expr2;

    public OrExpression(Expression expr1, Expression expr2) {
        this.expr1 = expr1;
        this.expr2 = expr2;
    }

    public boolean interpret(String context) {
        return expr1.interpret(context) || expr2.interpret(context);
    }
}

        Expression isJavaOrSpring = new OrExpression(isJava, isSpring);

    }
}`,

        // State Management

                    const btn = document.createElement('button');
                    btn.className = `w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between group ${currentSectionId === item.id ? 'bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`;

        }

                            <div class="relative">

                            <div class="space-y-6">
                                ${targetItem.questions.map((q, idx) => `

                                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400">${q.level}</span>

                                `).join('')}

                        </div>

                        <!-- J. Interview Preparation -->
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">

                            <div class="space-y-4 text-sm text-slate-600 dark:text-slate-300">

                                    <strong class="text-slate-800 dark:text-slate-200">Frequently Asked Questions:</strong>
                                    <ul class="list-disc pl-5 mt-1 space-y-1">
                                        ${targetItem.interview.fqs.map(fq => `<li>${fq}</li>`).join('')}

                                    <strong class="text-slate-800 dark:text-slate-200">Scenario-Based Questions:</strong>
                                    <ul class="list-disc pl-5 mt-1 space-y-1">
                                        ${targetItem.interview.scenarios.map(sc => `<li>${sc}</li>`).join('')}
                                    </ul>
                                </div>
                                <div>
                                    <strong class="text-slate-800 dark:text-slate-200">Advantages & Disadvantages:</strong>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">

                                            <strong class="text-emerald-700 dark:text-emerald-400 text-xs uppercase">Pros</strong>
                                            <ul class="list-disc pl-4 mt-1 text-xs space-y-1">${targetItem.interview.pros.map(p => `<li>${p}</li>`).join('')}</ul>

                            <ul class="list-disc pl-5 space-y-2 text-sm text-slate-600 dark:text-slate-300">
                                ${targetItem.mistakes.map(m => `<li>${m}</li>`).join('')}
                            </ul>
                        </div>

                        ${getNavigationFooter(id)}
                    </div>
                `;
            }

            contentArea.scrollTop = 0;
            renderSidebar();
        }

        function getNavigationFooter(currentId) {
            let allItems = [];
            handbookData.forEach(cat => allItems.push(...cat.items));
            const currentIndex = allItems.findIndex(i => i.id === currentId);
            
            const prevItem = currentIndex > 0 ? allItems[currentIndex - 1] : null;
            const nextItem = currentIndex < allItems.length - 1 ? allItems[currentIndex + 1] : null;

            return `
                <div class="flex justify-between items-center pt-8 border-t border-slate-200 dark:border-slate-800 mt-12">
                    ${prevItem ? `<button onclick="loadSection('${prevItem.id}')" class="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-xs font-semibold transition flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> ${prevItem.title}</button>` : '<div></div>'}
                    ${nextItem ? `<button onclick="loadSection('${nextItem.id}')" class="px-4 py-2.5 bg-indigo-600 text-white hover:bg-indigo-700 rounded-xl text-xs font-semibold transition flex items-center gap-2">${nextItem.title} <i class="fa-solid fa-arrow-right"></i></button>` : '<div></div>'}
                </div>
            `;
        }

        function toggleComplete(id) {
            if (completedItems.includes(id)) {
                completedItems = completedItems.filter(i => i !== id);
                showToast('Lesson marked incomplete');
            } else {
                completedItems.push(id);
                showToast('Lesson completed! Keep it up 🚀');
            }
            localStorage.setItem('java_dp_completed', JSON.stringify(completedItems));
            updateProgress();
            renderSidebar();
        }

        function updateProgress() {
            let totalItems = 0;
            handbookData.forEach(cat => totalItems += cat.items.length);
            const percentage = Math.round((completedItems.length / totalItems) * 100);
            
            document.getElementById('progressText').innerText = `${completedItems.length} / ${totalItems} completed`;
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        function toggleAnswer(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function copyCode(btn) {
            const pre = btn.parentElement.nextElementSibling.nextElementSibling.querySelector('code');
            const range = document.createRange();
            range.selectNode(pre);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            try {
                document.execCommand('copy');
                showToast('Code copied to clipboard successfully!');
            } catch (err) {
                showToast('Failed to copy code.');
            }
            window.getSelection().removeAllRanges();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.oninput = (e) => {
                const query = e.target.value.toLowerCase();
                if (!query) {
                    renderSidebar();
                    return;
                }
                const navContainer = document.getElementById('navLinks');
                navContainer.innerHTML = '';
                
                handbookData.forEach(cat => {
                    const matched = cat.items.filter(item => item.title.toLowerCase().includes(query));
                    if (matched.length > 0) {
                        const catHeader = document.createElement('div');
                        catHeader.className = 'px-3 py-2 text-xs font-bold text-slate-400 uppercase tracking-wider mt-4';
                        catHeader.innerText = cat.category;
                        navContainer.appendChild(catHeader);

                        matched.forEach(item => {
                            const btn = document.createElement('button');
                            btn.className = 'w-full text-left px-3 py-2.5 rounded-xl transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold';
                            btn.innerText = item.title;
                            btn.onclick = () => loadSection(item.id);
                            navContainer.appendChild(btn);
                        });
                    }
                });
            };
        }

        function setupTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
            }

            themeToggle.onclick = () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            };
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('sidebarToggle').onclick = () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        };

        window.onload = initHandbook;
    </script>
